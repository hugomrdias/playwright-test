# Preview releases on https://pkg.pr.new for every pull request and every
# commit to master, needs the pkg.pr.new GitHub App on the repository
name: preview
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A push to a pull request cancels its previous run, every commit to master
# gets its own group so none of them miss a preview
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The preview is linked to the head commit, not the merge commit pull
      # requests check out by default
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/setup@v3
        with:
          cache: true
      # `--pnpm` packs with `pnpm pack`, which applies `publishConfig` and runs
      # the prepack build, like `pnpm publish` in the release job
      - run: pnpm exec pkg-pr-new publish --pnpm --packageManager=pnpm
