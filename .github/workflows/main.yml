name: tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pull requests only, master runs include the release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm run lint

  test:
    # The lowest Node.js we support keeps the plain name
    name: test (${{ matrix.os }}${{ matrix.node != 24 && format(', node {0}', matrix.node) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      # pnpm runs everything with the Node.js from devEngines
      - run: |
          pnpm exec node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.devEngines.runtime.version = '^${{ matrix.node }}.0.0'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))"
          pnpm install --no-frozen-lockfile
        if: matrix.node != 24
        shell: bash
      # Passing on another version would look like this one works
      - run: pnpm exec node -p "require('assert').strictEqual(Number.parseInt(process.versions.node, 10), ${{ matrix.node }}); process.version"
        shell: bash
      - run: pnpm exec playwright-core install-deps webkit
        if: runner.os == 'Linux'
      # Tests would download them on first use, which counts against their timeouts
      - run: pnpm exec playwright-core install chromium firefox webkit
      - run: pnpm run test
        env:
          # Browser profiles are slow on C:, the default temp folder, Chromium can
          # take 18s to navigate. The runner temp folder is on D:.
          PW_TEST_CHILD_TEMP: ${{ runner.os == 'Windows' && runner.temp || '' }}

  release:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/setup@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          cache: true
      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm publish
        if: ${{ steps.release.outputs.release_created }}
