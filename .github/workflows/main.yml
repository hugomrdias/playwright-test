name: tests
env:
  CI: true
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm exec playwright-core install-deps webkit
      - run: pnpm run lint
      - run: pnpm run test
      - run: ./cli.js mocks/test.mocha.js --browser chromium
      - run: ./cli.js mocks/test.mocha.js --browser firefox
      - run: node --test --test-isolation=none --test-force-exit --test-timeout=120000 --test-name-pattern="console output" tests/output.test.js
        env:
          PW_TEST_BROWSER: firefox
      - run: ./cli.js mocks/test.mocha.js --browser webkit

  macos:
    name: Mac
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm run lint
      - run: pnpm run test
      - run: ./cli.js mocks/test.mocha.js --browser chromium
      - run: ./cli.js mocks/test.mocha.js --browser firefox
      - run: node --test --test-isolation=none --test-force-exit --test-timeout=120000 --test-name-pattern="console output" tests/output.test.js
        env:
          PW_TEST_BROWSER: firefox
      - run: ./cli.js mocks/test.mocha.js --browser webkit

  win:
    name: Win
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm run test
      - run: node cli.js mocks/test.mocha.js --browser chromium
      - run: node cli.js mocks/test.mocha.js --browser firefox
      - run: node --test --test-isolation=none --test-force-exit --test-timeout=120000 --test-name-pattern="console output" tests/output.test.js
        env:
          PW_TEST_BROWSER: firefox
      - run: node cli.js mocks/test.mocha.js --browser webkit
  release:
    runs-on: ubuntu-latest
    needs:
      - linux
      - macos
      - win
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/setup@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          cache: true
      - run: pnpm run lint
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm publish
        if: ${{ steps.release.outputs.release_created }}
