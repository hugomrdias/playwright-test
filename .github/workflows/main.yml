name: tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Pull requests only, master runs include the release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm exec playwright-core install-deps webkit
        if: runner.os == 'Linux'
      # Tests would download them on first use, which counts against their timeouts
      - run: pnpm exec playwright-core install chromium firefox webkit
      - run: pnpm run test

  release:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node
      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
      - uses: pnpm/setup@v3
        if: ${{ steps.release.outputs.release_created }}
        with:
          cache: true
      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm publish
        if: ${{ steps.release.outputs.release_created }}
